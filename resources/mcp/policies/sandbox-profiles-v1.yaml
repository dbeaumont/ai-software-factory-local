version: "1"
profiles:
  patch-check-v1:
    operation: VALIDATE_PATCH
    network: none
    timeout: 3m
    memory: 2g
    cpus: 2
    pids: 512
  patch-apply-v1:
    operation: APPLY_PATCH
    network: none
    timeout: 3m
    memory: 2g
    cpus: 2
    pids: 512
  test-maven-v1:
    operation: RUN_TESTS
    selector: "mvnw || pom.xml"
    network: ai-factory-network
    timeout: 15m
    memory: 2g
    cpus: 2
    pids: 512
  test-gradle-v1:
    operation: RUN_TESTS
    selector: "gradlew || build.gradle || build.gradle.kts"
    network: ai-factory-network
    timeout: 15m
    memory: 2g
    cpus: 2
    pids: 512
  test-node-v1:
    operation: RUN_TESTS
    selector: package.json
    network: ai-factory-network
    timeout: 15m
    memory: 2g
    cpus: 2
    pids: 512
  quality-sonar-v1:
    operation: RUN_QUALITY
    network: ai-factory-network
    timeout: 15m
    memory: 2g
    cpus: 2
    pids: 512
  security-syft-trivy-v2:
    operation: RUN_SECURITY
    network: ai-factory-network
    timeout: 10m
    memory: 2g
    cpus: 2
    pids: 512
arguments:
  profiles: forbidden
  commands: forbidden
  images: forbidden
  networks: forbidden
  volumes: forbidden
  environment: forbidden
