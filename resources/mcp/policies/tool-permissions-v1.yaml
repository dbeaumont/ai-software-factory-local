version: "1"
default: deny
roles:
  workflow:
    tools:
      - context.list_tree
      - context.search_code
      - context.read_file
      - context.get_repository_rules
      - context.get_dependencies
      - context.get_symbols
      - sandbox.validate_patch
      - sandbox.apply_patch
      - sandbox.run_tests
      - sandbox.run_quality
      - sandbox.run_security
      - sandbox.get_execution
      - sandbox.cancel_execution
      - scm.create_draft_pull_request
  supervisor:
    tools:
      - context.list_tree
      - context.search_code
      - context.get_repository_rules
      - context.get_dependencies
      - evidence.get_summary
  architecture-agent:
    tools:
      - context.list_tree
      - context.search_code
      - context.read_file
      - context.get_repository_rules
      - context.get_dependencies
      - context.get_symbols
  impact-analysis:
    tools:
      - context.search_code
      - context.read_file
      - context.get_repository_rules
      - context.get_symbols
  dependencies-contracts:
    tools:
      - context.list_tree
      - context.read_file
      - context.get_dependencies
  code-agent:
    tools:
      - context.list_tree
      - context.search_code
      - context.get_repository_rules
  planner:
    tools:
      - context.list_tree
      - context.search_code
      - context.read_file
      - context.get_repository_rules
      - context.get_dependencies
      - context.get_symbols
      - evidence.get_summary
  developer:
    tools:
      - context.list_tree
      - context.search_code
      - context.read_file
      - context.get_repository_rules
      - context.get_dependencies
      - context.get_symbols
  patch-repair:
    tools:
      - context.read_file
      - context.get_symbols
  test-agent:
    tools:
      - context.search_code
      - context.read_file
      - context.get_dependencies
      - context.get_symbols
      - evidence.get_summary
  test-design:
    tools:
      - context.search_code
      - context.read_file
      - context.get_dependencies
      - context.get_symbols
  test-evidence:
    tools:
      - evidence.get_summary
  security-agent:
    tools:
      - context.search_code
      - context.read_file
      - context.get_dependencies
      - context.get_symbols
      - evidence.get_summary
  threat-model:
    tools:
      - context.search_code
      - context.read_file
      - context.get_dependencies
      - context.get_symbols
  security-findings:
    tools:
      - evidence.get_summary
  independent-reviewer:
    tools:
      - context.search_code
      - context.read_file
      - context.get_dependencies
      - context.get_symbols
      - evidence.get_summary
      - evidence.read
  tester:
    tools:
      - context.search_code
      - context.read_file
      - context.get_dependencies
      - context.get_symbols
  reviewer:
    tools:
      - context.search_code
      - context.read_file
      - context.get_dependencies
      - context.get_symbols
      - evidence.get_summary
      - evidence.read
limits:
  defaultsPolicy: default-limits-v1
  maxResponseBytes: 65536
  maxToolCallsPerAgentTurn: 12
  maxConcurrentCallsPerTask: 4
  requestTimeout: 20s
  sandbox:
    maxConcurrentJobs: 2
    maxRetainedJobs: 500
    maxPatchBytes: 1048576
    maxOutputBytes: 65536
    effectfulActors:
      - workflow
  scm:
    effectfulActors:
      - workflow
  assurance:
    effectfulActors:
      - workflow
  evidence:
    effectfulActors:
      - workflow
