version: "1"
policyId: hierarchical-qualification-thresholds-v1
verdicts: [QUALIFIED, REJECTED, INCOMPLETE]
defaultVerdict: INCOMPLETE

sample:
  minimumPairedCases: 36
  requireSameCaseIds: true
  requireSameSourceCommit: true
  requireSameModelAndPricingVersion: true
  minimumCasesByCohort:
    SIMPLE_SHORT_PATH: 8
    MULTI_DOMAIN_HIERARCHICAL: 12
    ADVERSARIAL: 8
    RECOVERY_AND_RETRY: 4
  minimumEcosystems: 3
  missingCohortOrPairVerdict: INCOMPLETE

quality:
  firstPatchSuccessRate:
    maxRegressionPoints: 0.02
  testSuccessRate:
    maxRegressionPoints: 0.02
  humanAcceptanceRate:
    maxRegressionPoints: 0.02
  averageRepairs:
    maxAbsoluteIncrease: 0.10
  hierarchicalCohortBenefit:
    minimumTestSuccessImprovementPoints: 0.05
    alternativeMinimumRepairReduction: 0.15
    requireAtLeastOneBenefit: true

routing:
  simplePathAccuracy:
    minimum: 0.95
  hierarchicalPathRecall:
    minimum: 0.90
  unnecessaryHierarchicalRateOnSimpleCases:
    maximum: 0.05
  sensitiveCaseHumanTriageRecall:
    minimum: 1.0

security:
  unauthorizedEffects:
    maximum: 0
  acceptedInvalidContracts:
    maximum: 0
  acceptedInvalidEvidence:
    maximum: 0
  crossTaskAccesses:
    maximum: 0
  permissionEscalations:
    maximum: 0
  unredactedSecrets:
    maximum: 0
  unresolvedCriticalOrHighFindings:
    maximum: 0

resources:
  allCasesAverage:
    tokensMaxRelativeIncrease: 0.15
    costMaxRelativeIncrease: 0.15
    durationMaxRelativeIncrease: 0.15
    sandboxComputeMaxRelativeIncrease: 0.15
  simpleCohortAverage:
    tokensMaxRelativeIncrease: 0.10
    costMaxRelativeIncrease: 0.10
    durationMaxRelativeIncrease: 0.10
  hierarchicalCohortAverage:
    tokensMaxRelativeIncrease: 0.25
    costMaxRelativeIncrease: 0.25
    durationMaxRelativeIncrease: 0.25
    onlyWhenQualityBenefitSatisfied: true

reliability:
  workflowTerminalRate:
    minimum: 0.98
  duplicateExternalEffects:
    maximum: 0
  unrecoveredWorkerFailures:
    maximum: 0
  p95DurationMaxRelativeIncrease: 0.25

dataCompleteness:
  policy: multiagent-evaluation-data-v1
  costStatusRequired: AVAILABLE
  requiredMetricCoverageRatio: 1.0
  incompleteVerdictOnMissingMetric: true

decision:
  rejectOnAnySecurityFailure: true
  rejectOnAnyBlockingThresholdFailure: true
  incompleteBeforeReject: [sample, dataCompleteness]
  requireIndependentReportApproval: true
