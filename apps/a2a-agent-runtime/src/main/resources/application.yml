spring:
  application:
    name: ai-factory-a2a-agent-runtime
  main:
    banner-mode: "off"
  lifecycle:
    timeout-per-shutdown-phase: ${AI_FACTORY_AGENT_SHUTDOWN_GRACE:30s}

server:
  port: ${AI_FACTORY_AGENT_PORT:8090}
  shutdown: graceful
  ssl:
    enabled: ${AI_FACTORY_A2A_TLS_ENABLED:false}
    enabled-protocols: TLSv1.3
    client-auth: ${AI_FACTORY_A2A_TLS_CLIENT_AUTH:none}
    certificate: ${AI_FACTORY_A2A_TLS_CERTIFICATE:}
    certificate-private-key: ${AI_FACTORY_A2A_TLS_PRIVATE_KEY:}
    trust-certificate: ${AI_FACTORY_A2A_TLS_TRUST_CERTIFICATE:}

management:
  tracing:
    sampling:
      probability: ${AI_FACTORY_OTEL_TRACES_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    enabled: ${AI_FACTORY_OTEL_ENABLED:true}
    resource-attributes:
      service.namespace: ai-software-factory
      service.version: 0.1.0
  otlp:
    metrics:
      export:
        enabled: ${AI_FACTORY_OTEL_ENABLED:true}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://otel-collector:4318/v1/metrics}
        base-time-unit: seconds
        step: 15s
        batch-size: 1000
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,agentRuntimeIdentity,agentRuntimeDependencies
        liveness:
          include: livenessState

ai-factory:
  agent-runtime:
    tck:
      enabled: ${AI_FACTORY_A2A_TCK_ENABLED:false}
    role: ${AI_FACTORY_AGENT_ROLE:}
    endpoint: ${AI_FACTORY_AGENT_ENDPOINT:http://localhost:${AI_FACTORY_AGENT_PORT:8090}/a2a}
    security:
      enabled: ${AI_FACTORY_A2A_SECURITY_ENABLED:false}
      mtls-required: ${AI_FACTORY_A2A_MTLS_REQUIRED:false}
      oauth2-issuer: ${AI_FACTORY_A2A_OAUTH2_ISSUER:}
      oauth2-token-url: ${AI_FACTORY_A2A_OAUTH2_TOKEN_URL:}
      audience: ${AI_FACTORY_A2A_OAUTH2_AUDIENCE:}
      maximum-token-lifetime: ${AI_FACTORY_A2A_OAUTH2_MAX_TOKEN_LIFETIME:5m}
      local-principal-enabled: ${AI_FACTORY_A2A_LOCAL_PRINCIPAL_ENABLED:false}
      crl: ${AI_FACTORY_A2A_TLS_CRL:}
    card-signing:
      jwk-set-path: ${AI_FACTORY_A2A_CARD_JWK_SET_PATH:}
      active-key-id: ${AI_FACTORY_A2A_CARD_ACTIVE_KID:}
    card-identity:
      issuer: ${AI_FACTORY_A2A_CARD_ISSUER:ai-factory-local}
      provider-name: ${AI_FACTORY_A2A_CARD_PROVIDER_NAME:AI Software Factory}
      provider-url: ${AI_FACTORY_A2A_CARD_PROVIDER_URL:https://ai-factory.local}
      validity: ${AI_FACTORY_A2A_CARD_VALIDITY:15m}
    push-notification:
      enabled: ${AI_FACTORY_A2A_PUSH_ENABLED:false}
      callback: ${AI_FACTORY_A2A_PUSH_CALLBACK:}
      hmac-secret-file: ${AI_FACTORY_A2A_PUSH_HMAC_SECRET_FILE:}
      max-attempts: ${AI_FACTORY_A2A_PUSH_MAX_ATTEMPTS:4}
      initial-backoff: ${AI_FACTORY_A2A_PUSH_INITIAL_BACKOFF:1s}
    task-store:
      enabled: ${AI_FACTORY_A2A_TASK_STORE_ENABLED:false}
      jdbc-url: ${AI_FACTORY_A2A_TASK_JDBC_URL:}
      username: ${AI_FACTORY_A2A_TASK_DB_USERNAME:}
      password: ${AI_FACTORY_A2A_TASK_DB_PASSWORD:}
      maximum-pool-size: ${AI_FACTORY_A2A_TASK_DB_POOL_SIZE:4}
    temporal:
      enabled: ${AI_FACTORY_A2A_TEMPORAL_ENABLED:false}
      target: ${AI_FACTORY_TEMPORAL_TARGET:temporal:7233}
      namespace: ${AI_FACTORY_TEMPORAL_NAMESPACE:ai-factory}
      deployment-name: ${AI_FACTORY_A2A_TEMPORAL_DEPLOYMENT:ai-factory-a2a-agents}
      build-id: ${AI_FACTORY_A2A_TEMPORAL_BUILD_ID:dev}
      recovery-interval: ${AI_FACTORY_A2A_RECOVERY_INTERVAL:15s}
    concurrency:
      workflow-pollers: ${AI_FACTORY_A2A_WORKFLOW_POLLERS:2}
      activity-pollers: ${AI_FACTORY_A2A_ACTIVITY_POLLERS:2}
      max-workflow-executions: ${AI_FACTORY_A2A_MAX_WORKFLOWS:32}
      max-activity-executions: ${AI_FACTORY_A2A_MAX_ACTIVITIES:16}
      max-active-tasks-per-tenant: ${AI_FACTORY_A2A_MAX_TASKS_PER_TENANT:64}
      max-queued-tasks: ${AI_FACTORY_A2A_MAX_QUEUED_TASKS:1000}
      shutdown-grace: ${AI_FACTORY_AGENT_SHUTDOWN_GRACE:30s}
    rate-limit:
      window: ${AI_FACTORY_A2A_RATE_LIMIT_WINDOW:1m}
      requests-per-identity: ${AI_FACTORY_A2A_REQUESTS_PER_IDENTITY:120}
      polls-per-identity: ${AI_FACTORY_A2A_POLLS_PER_IDENTITY:60}
      cancellations-per-identity: ${AI_FACTORY_A2A_CANCELLATIONS_PER_IDENTITY:10}
      notifications-per-role: ${AI_FACTORY_A2A_NOTIFICATIONS_PER_ROLE:120}
      max-tracked-identities: ${AI_FACTORY_A2A_MAX_TRACKED_IDENTITIES:10000}
    llm:
      base-url: ${AI_FACTORY_LLM_BASE_URL:http://litellm:4000/v1}
      api-key: ${AI_FACTORY_LLM_API_KEY:}
      provider: ${AI_FACTORY_LLM_PROVIDER:litellm}
      model: ${AI_FACTORY_LLM_MODEL:factory-code-cloud}
      max-output-tokens: ${AI_FACTORY_LLM_MAX_OUTPUT_TOKENS:8192}
      timeout: ${AI_FACTORY_LLM_TIMEOUT:10m}
    mcp:
      enabled: ${AI_FACTORY_MCP_ENABLED:false}
      request-timeout: ${AI_FACTORY_MCP_REQUEST_TIMEOUT:20s}
      repository-context-url: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_URL:http://repository-context-mcp:8091}
      evidence-url: ${AI_FACTORY_MCP_EVIDENCE_URL:http://evidence-mcp:8095}
      security-enabled: ${AI_FACTORY_MCP_ROLE_SECURITY_ENABLED:false}
      client-id: ${AI_FACTORY_MCP_ROLE_CLIENT_ID:}
      access-token-file: ${AI_FACTORY_MCP_ROLE_ACCESS_TOKEN_FILE:}
