spring:
  application:
    name: ai-factory-a2a-agent-runtime
  main:
    banner-mode: "off"

server:
  port: ${AI_FACTORY_AGENT_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,agentRuntimeIdentity

ai-factory:
  agent-runtime:
    role: ${AI_FACTORY_AGENT_ROLE:}
    endpoint: ${AI_FACTORY_AGENT_ENDPOINT:http://localhost:${AI_FACTORY_AGENT_PORT:8090}/a2a}
    llm:
      base-url: ${AI_FACTORY_LLM_BASE_URL:http://litellm:4000/v1}
      api-key: ${AI_FACTORY_LLM_API_KEY:}
      model: ${AI_FACTORY_LLM_MODEL:factory-code-cloud}
      max-output-tokens: ${AI_FACTORY_LLM_MAX_OUTPUT_TOKENS:8192}
      timeout: ${AI_FACTORY_LLM_TIMEOUT:10m}
    mcp:
      enabled: ${AI_FACTORY_MCP_ENABLED:false}
      request-timeout: ${AI_FACTORY_MCP_REQUEST_TIMEOUT:20s}
      repository-context-url: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_URL:http://repository-context-mcp:8091}
      evidence-url: ${AI_FACTORY_MCP_EVIDENCE_URL:http://evidence-mcp:8095}
