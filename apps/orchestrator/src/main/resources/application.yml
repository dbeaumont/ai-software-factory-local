server:
  port: 8080

spring:
  application:
    name: ai-factory-orchestrator
  ai:
    mcp:
      client:
        enabled: ${AI_FACTORY_MCP_CLIENT_ENABLED:${AI_FACTORY_MCP_ENABLED:false}}
        name: ai-factory-orchestrator
        version: 0.1.0
        type: SYNC
        request-timeout: ${AI_FACTORY_MCP_REQUEST_TIMEOUT:20s}
        toolcallback:
          enabled: false
        streamable-http:
          connections:
            repository-context:
              url: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_URL:http://repository-context-mcp:8091}
              endpoint: /mcp
            sandbox-execution:
              url: ${AI_FACTORY_MCP_SANDBOX_URL:http://sandbox-execution-mcp:8092}
              endpoint: /mcp
            scm-delivery:
              url: ${AI_FACTORY_MCP_SCM_URL:http://scm-delivery-mcp:8093}
              endpoint: /mcp
            assurance:
              url: ${AI_FACTORY_MCP_ASSURANCE_URL:http://assurance-mcp:8094}
              endpoint: /mcp

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

ai-factory:
  agent-tools:
    enabled-roles: ${AI_FACTORY_AGENT_TOOL_ROLES:}
    qualification-verdict: ${AI_FACTORY_AGENT_TOOL_QUALIFICATION:INCOMPLETE}
    paired-cases: ${AI_FACTORY_AGENT_TOOL_PAIRED_CASES:0}
    security-passed: ${AI_FACTORY_AGENT_TOOL_SECURITY_PASSED:false}
  mcp:
    enabled: ${AI_FACTORY_MCP_ENABLED:true}
    repository-context-mode: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_MODE:MCP_ACTIVE}
    repository-context-active-roles: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_ACTIVE_ROLES:planner,developer,patch-repair}
    repository-context-server-name: repository-context-mcp
    sandbox-enabled: ${AI_FACTORY_MCP_SANDBOX_ENABLED:false}
    sandbox-mode: ${AI_FACTORY_MCP_SANDBOX_MODE:DIRECT}
    sandbox-active-operations: ${AI_FACTORY_MCP_SANDBOX_ACTIVE_OPERATIONS:validate_patch,apply_patch,run_tests,run_quality,run_security}
    sandbox-server-name: sandbox-execution-mcp
    sandbox-poll-interval: ${AI_FACTORY_MCP_SANDBOX_POLL_INTERVAL:250ms}
    sandbox-poll-timeout: ${AI_FACTORY_MCP_SANDBOX_POLL_TIMEOUT:20m}
    scm-delivery:
      enabled: ${AI_FACTORY_MCP_SCM_ENABLED:false}
      server-name: scm-delivery-mcp
      approver: ${AI_FACTORY_APPROVER_NAME:David Beaumont}
      approval-key: ${APPROVAL_ATTESTATION_KEY:}
    assurance:
      enabled: ${AI_FACTORY_MCP_ASSURANCE_ENABLED:false}
      server-name: assurance-mcp
    client:
      enabled: ${AI_FACTORY_MCP_CLIENT_ENABLED:${AI_FACTORY_MCP_ENABLED:false}}
      request-timeout: ${AI_FACTORY_MCP_REQUEST_TIMEOUT:20s}
      max-response-bytes: ${AI_FACTORY_MCP_MAX_RESPONSE_BYTES:65536}
      max-inflight-per-server: ${AI_FACTORY_MCP_MAX_INFLIGHT_PER_SERVER:16}
      max-inflight-per-task: ${AI_FACTORY_MCP_MAX_INFLIGHT_PER_TASK:4}
      accepted-protocol-versions: ${AI_FACTORY_MCP_ACCEPTED_PROTOCOL_VERSIONS:2025-11-25,2025-06-18}
      retry:
        read-only:
          max-attempts: ${AI_FACTORY_MCP_READ_RETRY_MAX_ATTEMPTS:3}
          initial-backoff: ${AI_FACTORY_MCP_READ_RETRY_INITIAL_BACKOFF:200ms}
          max-backoff: ${AI_FACTORY_MCP_READ_RETRY_MAX_BACKOFF:2s}
          multiplier: ${AI_FACTORY_MCP_READ_RETRY_MULTIPLIER:2.0}
          jitter: ${AI_FACTORY_MCP_READ_RETRY_JITTER:0.2}
        effectful:
          max-attempts: ${AI_FACTORY_MCP_EFFECT_RETRY_MAX_ATTEMPTS:2}
          initial-backoff: ${AI_FACTORY_MCP_EFFECT_RETRY_INITIAL_BACKOFF:500ms}
          max-backoff: ${AI_FACTORY_MCP_EFFECT_RETRY_MAX_BACKOFF:2s}
          multiplier: ${AI_FACTORY_MCP_EFFECT_RETRY_MULTIPLIER:2.0}
          jitter: ${AI_FACTORY_MCP_EFFECT_RETRY_JITTER:0.2}
      servers:
        repository-context:
          enabled: ${AI_FACTORY_MCP_ENABLED:false}
          uri: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_URL:http://repository-context-mcp:8091}
          audience: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_AUDIENCE:repository-context-mcp}
          request-timeout: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_TIMEOUT:${AI_FACTORY_MCP_REQUEST_TIMEOUT:20s}}
          expected-name: repository-context-mcp
          expected-version: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_VERSION:0.3.0}
          allowed-tools: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_ALLOWED_TOOLS:context.get_dependencies,context.get_repository_rules,context.list_tree,context.read_file,context.search_code}
        sandbox-execution:
          enabled: ${AI_FACTORY_MCP_SANDBOX_ENABLED:false}
          uri: ${AI_FACTORY_MCP_SANDBOX_URL:http://sandbox-execution-mcp:8092}
          audience: ${AI_FACTORY_MCP_SANDBOX_AUDIENCE:sandbox-execution-mcp}
          request-timeout: ${AI_FACTORY_MCP_SANDBOX_REQUEST_TIMEOUT:${AI_FACTORY_MCP_REQUEST_TIMEOUT:20s}}
          expected-name: sandbox-execution-mcp
          expected-version: ${AI_FACTORY_MCP_SANDBOX_VERSION:0.1.0}
          allowed-tools: sandbox.validate_patch,sandbox.apply_patch,sandbox.run_tests,sandbox.run_quality,sandbox.run_security,sandbox.get_execution,sandbox.cancel_execution
        scm-delivery:
          enabled: ${AI_FACTORY_MCP_SCM_ENABLED:false}
          uri: ${AI_FACTORY_MCP_SCM_URL:http://scm-delivery-mcp:8093}
          audience: ${AI_FACTORY_MCP_SCM_AUDIENCE:scm-delivery-mcp}
          request-timeout: ${AI_FACTORY_MCP_SCM_REQUEST_TIMEOUT:60s}
          expected-name: scm-delivery-mcp
          expected-version: ${AI_FACTORY_MCP_SCM_VERSION:0.1.0}
          allowed-tools: scm.get_repository,scm.resolve_revision,scm.create_draft_pull_request
        assurance:
          enabled: ${AI_FACTORY_MCP_ASSURANCE_ENABLED:false}
          uri: ${AI_FACTORY_MCP_ASSURANCE_URL:http://assurance-mcp:8094}
          audience: ${AI_FACTORY_MCP_ASSURANCE_AUDIENCE:assurance-mcp}
          request-timeout: ${AI_FACTORY_MCP_ASSURANCE_REQUEST_TIMEOUT:20s}
          expected-name: assurance-mcp
          expected-version: ${AI_FACTORY_MCP_ASSURANCE_VERSION:0.1.0}
          allowed-tools: assurance.evaluate_quality_gate,assurance.normalize_findings,assurance.evaluate_policy
  llm-base-url: ${AI_FACTORY_LLM_BASE_URL}
  llm-api-key: ${AI_FACTORY_LLM_API_KEY}
  cloud-model: ${AI_FACTORY_CLOUD_MODEL}
  cloud-enabled: ${AI_FACTORY_CLOUD_ENABLED}
  workspace-root: ${AI_FACTORY_WORKSPACE_ROOT}
  workspace-volume: ${AI_FACTORY_WORKSPACE_VOLUME}
  sandbox-image: ${AI_FACTORY_SANDBOX_IMAGE}
  sandbox-network: ${AI_FACTORY_SANDBOX_NETWORK}
  maven-mirror-url: ${MAVEN_MIRROR_URL:}
  artifactory-token: ${ARTIFACTORY_TOKEN:}
  sonarqube-url: ${AI_FACTORY_SONARQUBE_URL:http://sonarqube:9000}
  sonar-token: ${AI_FACTORY_SONAR_TOKEN:}
  prompt-root: ${AI_FACTORY_PROMPT_ROOT}
