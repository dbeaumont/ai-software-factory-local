server:
  port: 8092

spring:
  application:
    name: sandbox-execution-mcp
  jackson:
    property-naming-strategy: SNAKE_CASE
  ai:
    mcp:
      server:
        name: sandbox-execution-mcp
        version: 0.1.0
        type: SYNC
        protocol: STATELESS
        instructions: "Asynchronous allow-listed sandbox jobs. No caller-supplied commands, images, networks, volumes or environment variables."
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

ai-factory:
  sandbox:
    workspace-root: ${AI_FACTORY_SANDBOX_WORKSPACE_ROOT:/workspace/tasks}
    state-root: ${AI_FACTORY_SANDBOX_STATE_ROOT:/var/lib/ai-factory/sandbox-jobs}
    workspace-volume: ${AI_FACTORY_WORKSPACE_VOLUME:ai-software-factory_factory-workspace}
    image: ${AI_FACTORY_SANDBOX_IMAGE:ai-factory-sandbox:local}
    network: ${AI_FACTORY_SANDBOX_NETWORK:ai-factory-network}
    max-concurrent-jobs: ${AI_FACTORY_SANDBOX_MAX_CONCURRENT_JOBS:2}
    max-jobs: ${AI_FACTORY_SANDBOX_MAX_JOBS:500}
    job-retention: ${AI_FACTORY_SANDBOX_JOB_RETENTION:P7D}
    heartbeat-interval: ${AI_FACTORY_SANDBOX_HEARTBEAT_INTERVAL:PT15S}
    max-output-chars: ${AI_FACTORY_SANDBOX_MAX_OUTPUT_CHARS:65536}
    max-patch-bytes: ${AI_FACTORY_SANDBOX_MAX_PATCH_BYTES:1048576}
    maven-mirror-url: ${MAVEN_MIRROR_URL:}
    artifactory-token: ${ARTIFACTORY_TOKEN:}
    sonarqube-url: ${AI_FACTORY_SONARQUBE_URL:http://sonarqube:9000}
    sonar-token: ${AI_FACTORY_SONAR_TOKEN:}
