server:
  port: 8080

spring:
  application:
    name: ai-factory-orchestrator

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

ai-factory:
  llm-base-url: ${AI_FACTORY_LLM_BASE_URL}
  llm-api-key: ${AI_FACTORY_LLM_API_KEY}
  local-model: ${AI_FACTORY_LOCAL_MODEL}
  cloud-model: ${AI_FACTORY_CLOUD_MODEL}
  cloud-enabled: ${AI_FACTORY_CLOUD_ENABLED}
  workspace-root: ${AI_FACTORY_WORKSPACE_ROOT}
  workspace-volume: ${AI_FACTORY_WORKSPACE_VOLUME}
  sandbox-image: ${AI_FACTORY_SANDBOX_IMAGE}
  gitea-base-url: ${AI_FACTORY_GITEA_BASE_URL}
  gitea-public-base-url: ${AI_FACTORY_GITEA_PUBLIC_BASE_URL}
  gitea-token: ${AI_FACTORY_GITEA_TOKEN}
  gitea-user: ${AI_FACTORY_GITEA_USER}
  sonarqube-url: ${AI_FACTORY_SONARQUBE_URL}
  sonar-token: ${AI_FACTORY_SONAR_TOKEN}
  prompt-root: ${AI_FACTORY_PROMPT_ROOT}
