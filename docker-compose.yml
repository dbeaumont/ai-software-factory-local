name: ai-software-factory-local

services:
  gitea-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: gitea
      POSTGRES_DB: gitea
    volumes:
      - gitea-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [factory]

  gitea:
    image: gitea/gitea:1.23.7
    depends_on:
      gitea-db:
        condition: service_healthy
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: gitea
      GITEA__server__ROOT_URL: http://localhost:${GITEA_HTTP_PORT:-3000}/
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
    ports:
      - "${GITEA_HTTP_PORT:-3000}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/healthz | grep -q pass"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [factory]

  ollama:
    image: ollama/ollama:0.11.4
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [factory]

  orchestrator:
    build:
      context: ./orchestrator
    environment:
      AI_FACTORY_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      AI_FACTORY_OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      AI_FACTORY_WORKSPACE_ROOT: /workspace/tasks
      AI_FACTORY_SANDBOX_IMAGE: ai-factory-sandbox:local
      AI_FACTORY_GITEA_BASE_URL: http://gitea:3000
      AI_FACTORY_GITEA_TOKEN: ${GITEA_TOKEN:-}
      AI_FACTORY_GITEA_USER: ${GITEA_ADMIN_USER:-aiadmin}
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "${ORCHESTRATOR_PORT:-8088}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - factory-workspace:/workspace/tasks
      - ./prompts:/opt/ai-factory/prompts:ro
    depends_on:
      gitea:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks: [factory]

  sonar-db:
    profiles: ["full"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    networks: [factory]

  sonarqube:
    profiles: ["full"]
    image: sonarqube:community
    depends_on: [sonar-db]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "${SONAR_PORT:-9000}:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-logs:/opt/sonarqube/logs
      - sonar-extensions:/opt/sonarqube/extensions
    networks: [factory]

  nexus:
    profiles: ["full"]
    image: sonatype/nexus3:3.82.0
    ports:
      - "${NEXUS_PORT:-8081}:8081"
    volumes:
      - nexus-data:/nexus-data
    networks: [factory]

  prometheus:
    profiles: ["full"]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [factory]

  grafana:
    profiles: ["full"]
    image: grafana/grafana:12.1.1
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [factory]

networks:
  factory:
    name: ai-factory-local

volumes:
  gitea-db-data:
  gitea-data:
  ollama-data:
  factory-workspace:
  sonar-db-data:
  sonar-data:
  sonar-logs:
  sonar-extensions:
  nexus-data:
  grafana-data:
