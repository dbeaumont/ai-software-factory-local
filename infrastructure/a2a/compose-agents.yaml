      AI_FACTORY_AGENT_ENDPOINT: http://a2a-test-evidence:8090/a2a
    networks: [a2a-internal, workflow-internal, mcp-evidence-internal]

  a2a-security-agent:
    <<: *a2a-agent-runtime
    environment:
      <<: *a2a-agent-environment
      AI_FACTORY_AGENT_ROLE: security-agent
      AI_FACTORY_AGENT_ENDPOINT: http://a2a-security-agent:8090/a2a
    networks: [a2a-internal, workflow-internal, mcp-context-internal, mcp-evidence-internal]

  a2a-threat-model:
    <<: *a2a-agent-runtime
    environment:
      <<: *a2a-agent-environment
      AI_FACTORY_AGENT_ROLE: threat-model
      AI_FACTORY_AGENT_ENDPOINT: http://a2a-threat-model:8090/a2a
    networks: [a2a-internal, workflow-internal, mcp-context-internal]

  a2a-security-findings:
    <<: *a2a-agent-runtime
    environment:
      <<: *a2a-agent-environment
      AI_FACTORY_AGENT_ROLE: security-findings
      AI_FACTORY_AGENT_ENDPOINT: http://a2a-security-findings:8090/a2a
    networks: [a2a-internal, workflow-internal, mcp-evidence-internal]

  a2a-independent-reviewer:
    <<: *a2a-agent-runtime
    environment:
      <<: *a2a-agent-environment
      AI_FACTORY_AGENT_ROLE: independent-reviewer
      AI_FACTORY_AGENT_ENDPOINT: http://a2a-independent-reviewer:8090/a2a
    networks: [a2a-internal, workflow-internal, mcp-context-internal, mcp-evidence-internal]

volumes:
  a2a-task-db-data:
