x-a2a-agent-runtime: &a2a-agent-runtime
  image: ai-factory-a2a-agent-runtime:${AI_FACTORY_A2A_RUNTIME_VERSION:-0.1.0}
  build:
    context: ../..
    dockerfile: apps/a2a-agent-runtime/Dockerfile
    args:
      MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
      VCS_REF: ${AI_FACTORY_A2A_RUNTIME_REVISION:-local}
      BUILD_CREATED: ${AI_FACTORY_A2A_RUNTIME_CREATED:-local}
      SOURCE_REPOSITORY: "${AI_FACTORY_A2A_RUNTIME_SOURCE:-https://github.com/dbeaumont/ai-software-factory-local}"
    secrets:
      - artifactory_token
  restart: unless-stopped
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=64m,mode=1777
  environment: &a2a-agent-environment
    OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    AI_FACTORY_AGENT_PORT: "8090"
    AI_FACTORY_AGENT_SHUTDOWN_GRACE: ${AI_FACTORY_AGENT_SHUTDOWN_GRACE:-30s}
    AI_FACTORY_LLM_BASE_URL: "${AI_FACTORY_LLM_BASE_URL:-http://litellm:4000/v1}"
    AI_FACTORY_LLM_API_KEY: ${LITELLM_MASTER_KEY:-}
    AI_FACTORY_LLM_MODEL: ${AI_FACTORY_CLOUD_MODEL:-factory-code-cloud}
    AI_FACTORY_TEMPORAL_TARGET: "${AI_FACTORY_TEMPORAL_TARGET:-temporal:7233}"
    AI_FACTORY_TEMPORAL_NAMESPACE: ${AI_FACTORY_TEMPORAL_NAMESPACE:-ai-factory-local}
    AI_FACTORY_A2A_TEMPORAL_ENABLED: "false"
    AI_FACTORY_A2A_TASK_STORE_ENABLED: "true"
    AI_FACTORY_A2A_TASK_JDBC_URL: jdbc:postgresql://a2a-task-db:5432/ai_factory_a2a
    AI_FACTORY_A2A_TASK_DB_USERNAME: ai_factory_a2a
    AI_FACTORY_A2A_TASK_DB_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD}
    AI_FACTORY_A2A_TASK_DB_POOL_SIZE: ${AI_FACTORY_A2A_TASK_DB_POOL_SIZE:-4}
    AI_FACTORY_MCP_ENABLED: "false"
  networks: [a2a-internal, workflow-internal]
  depends_on:
    a2a-task-db:
      condition: service_healthy

services:
  a2a-task-db:
    image: postgres:16-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    environment:
      POSTGRES_DB: ai_factory_a2a
      POSTGRES_USER: ai_factory_a2a
      POSTGRES_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD}
    volumes:
      - a2a-task-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_factory_a2a -d ai_factory_a2a"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1g}
        reservations: {cpus: "0.10", memory: 128m}
    networks: [a2a-internal]

  a2a-supervisor:
    <<: *a2a-agent-runtime
    environment:
      <<: *a2a-agent-environment
      AI_FACTORY_AGENT_ROLE: supervisor
      AI_FACTORY_AGENT_ENDPOINT: http://a2a-supervisor:8090/a2a
    networks: [a2a-internal, workflow-internal, mcp-context-internal, mcp-evidence-internal]

  a2a-architecture-agent:
    <<: *a2a-agent-runtime
    environment:
      <<: *a2a-agent-environment
      AI_FACTORY_AGENT_ROLE: architecture-agent
      AI_FACTORY_AGENT_ENDPOINT: http://a2a-architecture-agent:8090/a2a
    networks: [a2a-internal, workflow-internal, mcp-context-internal]

  a2a-impact-analysis:
    <<: *a2a-agent-runtime
    environment:
      <<: *a2a-agent-environment
      AI_FACTORY_AGENT_ROLE: impact-analysis
      AI_FACTORY_AGENT_ENDPOINT: http://a2a-impact-analysis:8090/a2a
    networks: [a2a-internal, workflow-internal, mcp-context-internal]

  a2a-dependencies-contracts:
    <<: *a2a-agent-runtime
    environment:
      <<: *a2a-agent-environment
      AI_FACTORY_AGENT_ROLE: dependencies-contracts
      AI_FACTORY_AGENT_ENDPOINT: http://a2a-dependencies-contracts:8090/a2a
    networks: [a2a-internal, workflow-internal, mcp-context-internal]

  a2a-code-agent:
    <<: *a2a-agent-runtime
    environment:
      <<: *a2a-agent-environment
      AI_FACTORY_AGENT_ROLE: code-agent
      AI_FACTORY_AGENT_ENDPOINT: http://a2a-code-agent:8090/a2a
    networks: [a2a-internal, workflow-internal, mcp-context-internal]

  a2a-developer:
    <<: *a2a-agent-runtime
    environment:
      <<: *a2a-agent-environment
      AI_FACTORY_AGENT_ROLE: developer
      AI_FACTORY_AGENT_ENDPOINT: http://a2a-developer:8090/a2a
    networks: [a2a-internal, workflow-internal, mcp-context-internal]

  a2a-patch-repair:
    <<: *a2a-agent-runtime
    environment:
      <<: *a2a-agent-environment
      AI_FACTORY_AGENT_ROLE: patch-repair
      AI_FACTORY_AGENT_ENDPOINT: http://a2a-patch-repair:8090/a2a
    networks: [a2a-internal, workflow-internal, mcp-context-internal]

  a2a-test-agent:
    <<: *a2a-agent-runtime
    environment:
      <<: *a2a-agent-environment
      AI_FACTORY_AGENT_ROLE: test-agent
      AI_FACTORY_AGENT_ENDPOINT: http://a2a-test-agent:8090/a2a
    networks: [a2a-internal, workflow-internal, mcp-context-internal, mcp-evidence-internal]

  a2a-test-design:
    <<: *a2a-agent-runtime
    environment:
      <<: *a2a-agent-environment
      AI_FACTORY_AGENT_ROLE: test-design
      AI_FACTORY_AGENT_ENDPOINT: http://a2a-test-design:8090/a2a
    networks: [a2a-internal, workflow-internal, mcp-context-internal]

  a2a-test-evidence:
    <<: *a2a-agent-runtime
    environment:
      <<: *a2a-agent-environment
