groups:
  - name: ai-factory-multiagents
    interval: 30s
    rules:
      - alert: AiFactoryAgentLoopDetected
        expr: increase(ai_agent_failures_total{reason=~"repeated_call|max_turns"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: agents
        annotations:
          summary: Agent loop or turn limit detected
          description: An agent stopped after repeating an identical call or exhausting its turn limit.
          runbook_url: /docs/runbooks/AGENT-DEFAILLANT.md

      - alert: AiFactoryAgentBudgetExhausted
        expr: increase(ai_agent_failures_total{stop_condition="BUDGET_EXHAUSTED"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: agents
        annotations:
          summary: Agent execution budget exhausted
          description: A host-enforced token, cost, turn or fan-out budget stopped an agent.
          runbook_url: /docs/runbooks/AGENT-DEFAILLANT.md

      - alert: AiFactoryAgentCostSpike
        expr: sum(increase(ai_agent_cost_micros_total[15m])) > 5000000
        for: 5m
        labels:
          severity: warning
          component: agents
        annotations:
          summary: Aggregate agent cost exceeds the operational threshold
          description: Agent usage exceeded 5,000,000 cost micros over fifteen minutes.
          runbook_url: /docs/runbooks/AGENT-DEFAILLANT.md

      - alert: AiFactoryTaskQueueBacklog
        expr: max(ai_factory_sandbox_jobs_queued) > 20 or max(ai_task_queue_saturation_ratio) > 0.9
        for: 10m
        labels:
          severity: warning
          component: queues
        annotations:
          summary: Worker backlog or saturation is sustained
          description: More than twenty sandbox jobs are queued or a worker perimeter remains above 90 percent saturation.
          runbook_url: /docs/runbooks/SATURATION.md

      - alert: AiFactorySandboxHeartbeatInvalid
        expr: increase(ai_factory_sandbox_heartbeat_invalid_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          component: sandbox
        annotations:
          summary: Sandbox execution heartbeat is absent, invalid or stale
          description: The orchestrator rejected a sandbox heartbeat and failed the execution closed.
          runbook_url: /docs/runbooks/MCP-COMPROMIS.md

      - alert: AiFactoryAgentContractError
        expr: increase(ai_agent_failures_total{stop_condition="CONTRACT_ERROR"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: contracts
        annotations:
          summary: Agent output contract validation failed
          description: An agent emitted a malformed final turn or a result outside its declared output contract.
          runbook_url: /docs/runbooks/AGENT-DEFAILLANT.md

      - alert: AiFactoryEvidenceAltered
        expr: increase(ai_evidence_altered_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          component: evidence
        annotations:
          summary: Evidence integrity verification failed
          description: Evidence MCP metadata, content or digest diverged from its workflow binding.
          runbook_url: /docs/runbooks/MCP-COMPROMIS.md
