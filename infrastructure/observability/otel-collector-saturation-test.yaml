extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1
    send_batch_max_size: 1
    timeout: 100ms
  memory_limiter:
    check_interval: 1s
    limit_mib: 64
    spike_limit_mib: 16

exporters:
  otlp_http/slow:
    endpoint: http://ai-factory-otel-slow-sink-test:8080
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 8
    retry_on_failure:
      enabled: true
      initial_interval: 100ms
      max_interval: 1s
      max_elapsed_time: 5s

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/slow]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/slow]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/slow]
