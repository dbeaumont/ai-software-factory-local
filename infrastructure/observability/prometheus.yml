global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: orchestrator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["orchestrator:8080"]
  - job_name: repository-context-mcp
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["repository-context-mcp:8091"]
  - job_name: sandbox-execution-mcp
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["sandbox-execution-mcp:8092"]
  - job_name: temporal
    metrics_path: /metrics
    static_configs:
      - targets: ["temporal:8000"]
