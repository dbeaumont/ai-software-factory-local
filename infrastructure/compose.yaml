name: ai-software-factory

# All application services share this private Docker network; only explicitly mapped ports are exposed to the host.
services:
  # Source-control service and its dedicated persistent PostgreSQL database.
  gitea-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: gitea
      POSTGRES_DB: gitea
    volumes:
      - gitea-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [factory]

  gitea:
    image: gitea/gitea:1.23.7
    depends_on:
      gitea-db:
        condition: service_healthy
    environment:
      GITEA__database__DB_TYPE: ${GITEA_DB_TYPE}
      GITEA__database__HOST: ${GITEA_DB_HOST}
      GITEA__database__NAME: ${GITEA_DB_NAME}
      GITEA__database__USER: ${GITEA_DB_USER}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT}
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
    ports:
      - "${GITEA_HTTP_PORT}:3000"
      - "${GITEA_SSH_PORT}:22"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/healthz | grep -q pass"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [factory]

  # Cloud model gateway; .vault supplies provider credentials at runtime.
  litellm:
    build:
      context: ./litellm
      args:
        LITELLM_IMAGE: ${LITELLM_IMAGE}
    env_file:
      - ../.vault
    environment:
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_CA_CERT_HOST: ${OPENAI_CA_CERT_HOST:-api.openai.com:443}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    healthcheck:
      # LiteLLM needs a few seconds after its process starts to load its model
      # configuration and begin listening on port 4000.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)\""]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 5s
    networks: [factory]

  # Read-only MCP server that exposes bounded repository context for registered task workspaces.
  repository-context-mcp:
    build:
      context: ../apps/mcp/repository-context-server
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL}
      secrets:
        - artifactory_token
    environment:
      AI_FACTORY_CONTEXT_WORKSPACE_ROOT: /workspace/tasks
      AI_FACTORY_CONTEXT_REGISTRY_ROOT: /var/lib/ai-factory/context-registry
      AI_FACTORY_CONTEXT_MAX_FILE_BYTES: ${AI_FACTORY_CONTEXT_MAX_FILE_BYTES:-1048576}
      AI_FACTORY_CONTEXT_MAX_SEARCH_FILES: ${AI_FACTORY_CONTEXT_MAX_SEARCH_FILES:-1000}
      AI_FACTORY_CONTEXT_MAX_TREE_ENTRIES: ${AI_FACTORY_CONTEXT_MAX_TREE_ENTRIES:-1000}
      AI_FACTORY_CONTEXT_SYMBOLS_ENABLED: ${AI_FACTORY_CONTEXT_SYMBOLS_ENABLED:-false}
    volumes:
      - factory-workspace:/workspace/tasks:ro
      - context-registry-state:/var/lib/ai-factory/context-registry
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [mcp-internal]

  # Privileged controller for fixed-profile sandbox jobs. The Docker socket is deliberately isolated here.
  sandbox-execution-mcp:
    build:
      context: ../apps/mcp/sandbox-execution-server
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL}
      secrets:
        - artifactory_token
    environment:
      AI_FACTORY_SANDBOX_WORKSPACE_ROOT: /workspace/tasks
      AI_FACTORY_SANDBOX_STATE_ROOT: /var/lib/ai-factory/sandbox-jobs
      AI_FACTORY_WORKSPACE_VOLUME: ${AI_FACTORY_WORKSPACE_VOLUME}
      AI_FACTORY_SANDBOX_IMAGE: ${AI_FACTORY_SANDBOX_IMAGE}
      AI_FACTORY_SANDBOX_RUNTIME: ${AI_FACTORY_SANDBOX_RUNTIME:-docker}
      AI_FACTORY_SANDBOX_NETWORK: ${AI_FACTORY_SANDBOX_NETWORK}
      AI_FACTORY_SANDBOX_MAX_CONCURRENT_JOBS: ${AI_FACTORY_SANDBOX_MAX_CONCURRENT_JOBS:-2}
      AI_FACTORY_SANDBOX_MAX_QUEUED_JOBS: ${AI_FACTORY_SANDBOX_MAX_QUEUED_JOBS:-32}
      AI_FACTORY_SANDBOX_MAX_ACTIVE_JOBS_PER_TASK: ${AI_FACTORY_SANDBOX_MAX_ACTIVE_JOBS_PER_TASK:-2}
      AI_FACTORY_SANDBOX_MAX_JOBS: ${AI_FACTORY_SANDBOX_MAX_JOBS:-500}
      AI_FACTORY_SANDBOX_JOB_RETENTION: ${AI_FACTORY_SANDBOX_JOB_RETENTION:-P7D}
      AI_FACTORY_SANDBOX_HEARTBEAT_INTERVAL: ${AI_FACTORY_SANDBOX_HEARTBEAT_INTERVAL:-PT15S}
      AI_FACTORY_SANDBOX_MAX_OUTPUT_CHARS: ${AI_FACTORY_SANDBOX_MAX_OUTPUT_CHARS:-65536}
      AI_FACTORY_SANDBOX_MAX_PATCH_BYTES: ${AI_FACTORY_SANDBOX_MAX_PATCH_BYTES:-1048576}
      MAVEN_MIRROR_URL: ${AI_FACTORY_SANDBOX_MAVEN_MIRROR_URL}
      NPM_REGISTRY_URL: ${NPM_REGISTRY_URL:-https://registry.npmjs.org/}
      AI_FACTORY_SANDBOX_EGRESS_PROXY_URL: ${AI_FACTORY_SANDBOX_EGRESS_PROXY_URL:-http://sandbox-egress-proxy:3128}
      AI_FACTORY_SANDBOX_NO_PROXY: ${AI_FACTORY_SANDBOX_NO_PROXY:-artifactory,sonarqube,localhost,127.0.0.1}
      AI_FACTORY_SANDBOX_QUALITY_NETWORK: ${AI_FACTORY_SANDBOX_QUALITY_NETWORK:-ai-factory-sandbox-quality}
      ARTIFACTORY_TOKEN: ${ARTIFACTORY_TOKEN}
      AI_FACTORY_SONARQUBE_URL: ${AI_FACTORY_SONARQUBE_URL}
      AI_FACTORY_SONAR_TOKEN: ${SONAR_TOKEN}
    group_add:
      - ${DOCKER_SOCKET_GID:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - factory-workspace:/workspace/tasks:ro
      - sandbox-job-state:/var/lib/ai-factory/sandbox-jobs
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8092/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [mcp-internal]

  scm-delivery-mcp:
    build:
      context: ../apps/mcp/scm-delivery-server
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL}
      secrets:
        - artifactory_token
    environment:
      AI_FACTORY_SCM_GITEA_BASE_URL: ${AI_FACTORY_GITEA_BASE_URL:-http://gitea:3000}
      AI_FACTORY_SCM_GITEA_PUBLIC_BASE_URL: ${AI_FACTORY_GITEA_PUBLIC_BASE_URL:-http://localhost:3000}
      AI_FACTORY_SCM_GITEA_USER: ${AI_FACTORY_GITEA_USER:-aiadmin}
      AI_FACTORY_SCM_GITEA_TOKEN_FILE: /run/secrets/local_vault
      AI_FACTORY_SCM_STATE_ROOT: /var/lib/ai-factory/scm
      AI_FACTORY_SCM_REPOSITORY_REGISTRY: /etc/ai-factory/scm-repositories-v1.json
      AI_FACTORY_SCM_WORKSPACE_ROOT: /workspace/tasks
      AI_FACTORY_SCM_APPROVAL_KEY_FILE: /run/secrets/local_vault
    secrets:
      - local_vault
    volumes:
      - scm-delivery-state:/var/lib/ai-factory/scm
      - factory-workspace:/workspace/tasks:ro
      - ../resources/mcp/policies/scm-repositories-v1.json:/etc/ai-factory/scm-repositories-v1.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8093/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      gitea:
        condition: service_healthy
    networks: [factory, mcp-internal]

  assurance-mcp:
    build:
      context: ../apps/mcp/assurance-server
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL}
      secrets:
        - artifactory_token
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8094/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [mcp-internal]

  evidence-mcp:
    build:
      context: ../apps/mcp/evidence-server
      args: { MAVEN_MIRROR_URL: "${MAVEN_MIRROR_URL}" }
      secrets: [artifactory_token]
    environment:
      AI_FACTORY_EVIDENCE_STATE_ROOT: /var/lib/ai-factory/evidence
      AI_FACTORY_EVIDENCE_MAX_ARTIFACT_BYTES: ${AI_FACTORY_EVIDENCE_MAX_ARTIFACT_BYTES:-1048576}
      # POC: domain-separated derivation in evidence-mcp; replace with a dedicated Secret Manager key at MCP-217.
      AI_FACTORY_EVIDENCE_ENCRYPTION_KEY: ${APPROVAL_ATTESTATION_KEY}
    volumes:
      - evidence-state:/var/lib/ai-factory/evidence
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8095/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [mcp-internal]

  # The only component shared by untrusted jobs and an egress-capable network.
  # Squid denies every destination not listed in its immutable configuration.
  sandbox-egress-proxy:
    build:
      context: ./sandbox-egress-proxy
    read_only: true
    tmpfs:
      - /run:size=4m,mode=0755
      - /var/log/squid:size=16m,mode=0755
      - /var/spool/squid:size=16m,mode=0755
      - /tmp:size=4m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "grep -q '^Name:[[:space:]]*squid$' /proc/1/status"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [factory, sandbox-egress, sandbox-quality]

  # Spring Boot control plane. Its image pulls build dependencies through Artifactory using a BuildKit secret.
  orchestrator:
    build:
      context: ../apps/orchestrator
      additional_contexts:
        mcp-schemas: ../resources/mcp/schemas
        multiagent-schemas: ../resources/multiagents/schemas
        agent-resources: ../resources/agents
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL}
      secrets:
        - artifactory_token
    environment:
      AI_FACTORY_LLM_BASE_URL: ${AI_FACTORY_LLM_BASE_URL}
      AI_FACTORY_LLM_API_KEY: ${LITELLM_MASTER_KEY}
      AI_FACTORY_CLOUD_MODEL: ${AI_FACTORY_CLOUD_MODEL}
      AI_FACTORY_CLOUD_ENABLED: ${AI_FACTORY_CLOUD_ENABLED}
      AI_FACTORY_AGENT_TOOL_EVALUATION_ENABLED: ${AI_FACTORY_AGENT_TOOL_EVALUATION_ENABLED:-false}
      AI_FACTORY_AGENT_TOOL_EVALUATION_ROLES: ${AI_FACTORY_AGENT_TOOL_EVALUATION_ROLES:-}
      AI_FACTORY_AGENT_TOOL_ROLES: ${AI_FACTORY_AGENT_TOOL_ROLES:-}
      AI_FACTORY_AGENT_TOOL_QUALIFICATION: ${AI_FACTORY_AGENT_TOOL_QUALIFICATION:-INCOMPLETE}
      AI_FACTORY_AGENT_TOOL_PAIRED_CASES: ${AI_FACTORY_AGENT_TOOL_PAIRED_CASES:-0}
      AI_FACTORY_AGENT_TOOL_SECURITY_PASSED: ${AI_FACTORY_AGENT_TOOL_SECURITY_PASSED:-false}
      AI_FACTORY_WORKSPACE_ROOT: ${AI_FACTORY_WORKSPACE_ROOT}
      AI_FACTORY_WORKSPACE_VOLUME: ${AI_FACTORY_WORKSPACE_VOLUME}
      AI_FACTORY_SANDBOX_IMAGE: ${AI_FACTORY_SANDBOX_IMAGE}
      AI_FACTORY_SANDBOX_NETWORK: ${AI_FACTORY_SANDBOX_NETWORK}
      AI_FACTORY_PROMPT_ROOT: ${AI_FACTORY_PROMPT_ROOT}
      AI_FACTORY_MCP_CLIENT_ENABLED: ${AI_FACTORY_MCP_CLIENT_ENABLED:-true}
      AI_FACTORY_MCP_ENABLED: ${AI_FACTORY_MCP_ENABLED:-true}
      AI_FACTORY_MCP_REPOSITORY_CONTEXT_MODE: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_MODE:-MCP_ACTIVE}
      AI_FACTORY_MCP_REPOSITORY_CONTEXT_ACTIVE_ROLES: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_ACTIVE_ROLES:-planner,developer,patch-repair}
      AI_FACTORY_MCP_REPOSITORY_CONTEXT_URL: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_URL:-http://repository-context-mcp:8091}
      AI_FACTORY_MCP_REPOSITORY_CONTEXT_AUDIENCE: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_AUDIENCE:-repository-context-mcp}
      AI_FACTORY_MCP_REPOSITORY_CONTEXT_TIMEOUT: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_TIMEOUT:-20s}
      AI_FACTORY_MCP_REQUEST_TIMEOUT: ${AI_FACTORY_MCP_REQUEST_TIMEOUT:-20s}
      AI_FACTORY_MCP_MAX_RESPONSE_BYTES: ${AI_FACTORY_MCP_MAX_RESPONSE_BYTES:-65536}
      AI_FACTORY_MCP_MAX_INFLIGHT_PER_SERVER: ${AI_FACTORY_MCP_MAX_INFLIGHT_PER_SERVER:-16}
      AI_FACTORY_MCP_MAX_INFLIGHT_PER_TASK: ${AI_FACTORY_MCP_MAX_INFLIGHT_PER_TASK:-4}
      AI_FACTORY_MCP_ACCEPTED_PROTOCOL_VERSIONS: ${AI_FACTORY_MCP_ACCEPTED_PROTOCOL_VERSIONS:-2025-11-25,2025-06-18}
      AI_FACTORY_MCP_REPOSITORY_CONTEXT_VERSION: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_VERSION:-0.3.0}
      AI_FACTORY_MCP_REPOSITORY_CONTEXT_ALLOWED_TOOLS: ${AI_FACTORY_MCP_REPOSITORY_CONTEXT_ALLOWED_TOOLS:-context.get_dependencies,context.get_repository_rules,context.list_tree,context.read_file,context.search_code}
      AI_FACTORY_MCP_READ_RETRY_MAX_ATTEMPTS: ${AI_FACTORY_MCP_READ_RETRY_MAX_ATTEMPTS:-3}
      AI_FACTORY_MCP_READ_RETRY_INITIAL_BACKOFF: ${AI_FACTORY_MCP_READ_RETRY_INITIAL_BACKOFF:-200ms}
      AI_FACTORY_MCP_READ_RETRY_MAX_BACKOFF: ${AI_FACTORY_MCP_READ_RETRY_MAX_BACKOFF:-2s}
      AI_FACTORY_MCP_READ_RETRY_MULTIPLIER: ${AI_FACTORY_MCP_READ_RETRY_MULTIPLIER:-2.0}
      AI_FACTORY_MCP_READ_RETRY_JITTER: ${AI_FACTORY_MCP_READ_RETRY_JITTER:-0.2}
      AI_FACTORY_MCP_EFFECT_RETRY_MAX_ATTEMPTS: ${AI_FACTORY_MCP_EFFECT_RETRY_MAX_ATTEMPTS:-2}
      AI_FACTORY_MCP_EFFECT_RETRY_INITIAL_BACKOFF: ${AI_FACTORY_MCP_EFFECT_RETRY_INITIAL_BACKOFF:-500ms}
      AI_FACTORY_MCP_EFFECT_RETRY_MAX_BACKOFF: ${AI_FACTORY_MCP_EFFECT_RETRY_MAX_BACKOFF:-2s}
      AI_FACTORY_MCP_EFFECT_RETRY_MULTIPLIER: ${AI_FACTORY_MCP_EFFECT_RETRY_MULTIPLIER:-2.0}
      AI_FACTORY_MCP_EFFECT_RETRY_JITTER: ${AI_FACTORY_MCP_EFFECT_RETRY_JITTER:-0.2}
      AI_FACTORY_MCP_SANDBOX_ENABLED: ${AI_FACTORY_MCP_SANDBOX_ENABLED:-true}
      AI_FACTORY_MCP_SANDBOX_MODE: ${AI_FACTORY_MCP_SANDBOX_MODE:-MCP_ACTIVE}
      AI_FACTORY_MCP_SANDBOX_ACTIVE_OPERATIONS: ${AI_FACTORY_MCP_SANDBOX_ACTIVE_OPERATIONS:-validate_patch,apply_patch,run_tests,run_quality,run_security}
      AI_FACTORY_MCP_SANDBOX_URL: ${AI_FACTORY_MCP_SANDBOX_URL:-http://sandbox-execution-mcp:8092}
      AI_FACTORY_MCP_SANDBOX_AUDIENCE: ${AI_FACTORY_MCP_SANDBOX_AUDIENCE:-sandbox-execution-mcp}
      AI_FACTORY_MCP_SANDBOX_REQUEST_TIMEOUT: ${AI_FACTORY_MCP_SANDBOX_REQUEST_TIMEOUT:-20s}
      AI_FACTORY_MCP_SANDBOX_VERSION: ${AI_FACTORY_MCP_SANDBOX_VERSION:-0.1.0}
      AI_FACTORY_MCP_SANDBOX_POLL_INTERVAL: ${AI_FACTORY_MCP_SANDBOX_POLL_INTERVAL:-250ms}
      AI_FACTORY_MCP_SANDBOX_POLL_TIMEOUT: ${AI_FACTORY_MCP_SANDBOX_POLL_TIMEOUT:-20m}
      AI_FACTORY_MCP_SCM_ENABLED: ${AI_FACTORY_MCP_SCM_ENABLED:-true}
      AI_FACTORY_MCP_SCM_URL: ${AI_FACTORY_MCP_SCM_URL:-http://scm-delivery-mcp:8093}
      AI_FACTORY_MCP_SCM_AUDIENCE: ${AI_FACTORY_MCP_SCM_AUDIENCE:-scm-delivery-mcp}
      AI_FACTORY_MCP_SCM_REQUEST_TIMEOUT: ${AI_FACTORY_MCP_SCM_REQUEST_TIMEOUT:-60s}
      AI_FACTORY_MCP_SCM_VERSION: ${AI_FACTORY_MCP_SCM_VERSION:-0.1.0}
      AI_FACTORY_MCP_ASSURANCE_ENABLED: ${AI_FACTORY_MCP_ASSURANCE_ENABLED:-true}
      AI_FACTORY_MCP_ASSURANCE_URL: ${AI_FACTORY_MCP_ASSURANCE_URL:-http://assurance-mcp:8094}
      AI_FACTORY_MCP_ASSURANCE_AUDIENCE: ${AI_FACTORY_MCP_ASSURANCE_AUDIENCE:-assurance-mcp}
      AI_FACTORY_MCP_ASSURANCE_REQUEST_TIMEOUT: ${AI_FACTORY_MCP_ASSURANCE_REQUEST_TIMEOUT:-20s}
      AI_FACTORY_MCP_ASSURANCE_VERSION: ${AI_FACTORY_MCP_ASSURANCE_VERSION:-0.1.0}
      AI_FACTORY_APPROVER_NAME: ${AI_FACTORY_APPROVER_NAME:-David Beaumont}
      APPROVAL_ATTESTATION_KEY: ${APPROVAL_ATTESTATION_KEY}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    ports:
      - "${ORCHESTRATOR_PORT}:8080"
    volumes:
      - factory-workspace:/workspace/tasks
      - ../resources/prompts:/opt/ai-factory/resources/prompts:ro
    depends_on:
      gitea:
        condition: service_healthy
      litellm:
        condition: service_healthy
      artifactory:
        condition: service_healthy
      repository-context-mcp:
        condition: service_healthy
      sandbox-execution-mcp:
        condition: service_healthy
      scm-delivery-mcp:
        condition: service_healthy
      assurance-mcp:
        condition: service_healthy
    networks: [factory, mcp-internal]

  # Static frontend served internally; reverse-proxy exposes the public web entry point.
  factory-web:
    build:
      context: ../apps/web
      args:
        NPM_REGISTRY_URL: ${NPM_REGISTRY_URL}
        NPM_REGISTRY_HOST: ${NPM_REGISTRY_HOST}
      secrets:
        - artifactory_token
    volumes:
      - ../docs/assets:/usr/share/nginx/html/docs/assets:ro
    depends_on:
      - reverse-proxy
    networks: [factory]

  # Public HTTP entry point: serves the frontend and forwards API requests to the orchestrator.
  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_APP_PORT}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orchestrator
    networks: [factory]

  # SonarQube and its dedicated persistent PostgreSQL database.
  sonar-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    networks: [factory]

  sonarqube:
    image: sonarqube:community
    depends_on: [sonar-db]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "${SONAR_PORT}:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-logs:/opt/sonarqube/logs
      - sonar-extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9000/api/system/status | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 40
    networks: [factory, sandbox-quality]

  # Artifactory OSS requires PostgreSQL; embedded Derby is no longer supported.
  artifactory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ARTIFACTORY_DB_USER}
      POSTGRES_PASSWORD: ${ARTIFACTORY_DB_PASSWORD}
      POSTGRES_DB: ${ARTIFACTORY_DB_NAME}
    volumes:
      - artifactory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [factory]

  # Artifactory OSS does not expose repository-administration REST APIs.
  # Seed the supported first-start bootstrap file into its persistent volume.
  artifactory-config:
    image: busybox:1.37
    command: ["sh", "-c", "mkdir -p /data/etc/artifactory && cp /bootstrap/artifactory.config.import.yml /data/etc/artifactory/artifactory.config.import.yml"]
    volumes:
      - artifactory-data:/data
      - ./artifactory/artifactory.config.import.yml:/bootstrap/artifactory.config.import.yml:ro
    network_mode: none

  # Local artifact repository used for local artifact storage.
  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:7.104.6
    # Security keys and the database password come from .vault and must remain
    # stable while the Artifactory data volume exists.
    env_file:
      - ../.vault
    environment:
      JF_SHARED_DATABASE_TYPE: postgresql
      JF_SHARED_DATABASE_DRIVER: org.postgresql.Driver
      JF_SHARED_DATABASE_URL: jdbc:postgresql://artifactory-db:5432/${ARTIFACTORY_DB_NAME}
      JF_SHARED_DATABASE_USERNAME: ${ARTIFACTORY_DB_USER}
      JF_SHARED_DATABASE_PASSWORD: ${ARTIFACTORY_DB_PASSWORD}
    ports:
      - "${ARTIFACTORY_PORT}:8082"
    volumes:
      - artifactory-data:/var/opt/jfrog/artifactory
    depends_on:
      artifactory-db:
        condition: service_healthy
      artifactory-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/artifactory/api/system/ping >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 60
    networks: [factory, sandbox-egress, sandbox-quality]

  # Metrics collection and visualization for the orchestrator.
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks: [factory, mcp-internal]

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [factory]

networks:
  # Explicit name lets sandbox containers join the same network at runtime.
  factory:
    name: ai-factory-network
  # MCP read services have no direct external egress; only the orchestrator and observability join this segment.
  mcp-internal:
    name: ai-factory-mcp-internal
    internal: true
  # Test-job containers join only this internal segment. They can reach
  # Artifactory and the allow-listed proxy, but no control-plane service or SonarQube.
  sandbox-egress:
    name: ai-factory-sandbox-egress
    internal: true
  # Quality jobs receive SonarQube in addition to Artifactory and the proxy;
  # test jobs cannot join this network through any MCP argument.
  sandbox-quality:
    name: ai-factory-sandbox-quality
    internal: true

volumes:
  # Persistent service state. `factory-workspace` is shared with ephemeral task sandboxes.
  gitea-db-data:
  gitea-data:
  factory-workspace:
    name: ${AI_FACTORY_WORKSPACE_VOLUME}
  sandbox-job-state:
  context-registry-state:
  scm-delivery-state:
  evidence-state:
  sonar-db-data:
  sonar-data:
  sonar-logs:
  sonar-extensions:
  artifactory-data:
  artifactory-db-data:
  grafana-data:

secrets:
  # Utilisé uniquement au build (Dockerfile: --mount=type=secret,id=artifactory_token)
  # pour authentifier Maven auprès du miroir — jamais gravé dans l'image.
  artifactory_token:
    environment: ARTIFACTORY_TOKEN
  local_vault:
    file: ../.vault
