server {
  listen 80;
  server_name _;

  # Re-resolve Docker service names after container restarts.
  resolver 127.0.0.11 ipv6=off valid=10s;

  location /api/ {
    set $orchestrator_upstream http://orchestrator:8080;
    proxy_pass $orchestrator_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $factory_web_upstream http://factory-web:80;
    proxy_pass $factory_web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
