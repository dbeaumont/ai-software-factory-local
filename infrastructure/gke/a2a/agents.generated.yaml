apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-security-agent
  namespace: ai-factory-agents
  labels:
    app.kubernetes.io/name: a2a-agent-runtime
    ai-factory.io/agent-role: security-agent
spec:
  replicas: 2
  selector: &1
    matchLabels:
      app.kubernetes.io/name: a2a-agent-runtime
      ai-factory.io/agent-role: security-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a2a-agent-runtime
        ai-factory.io/agent-role: security-agent
    spec:
      serviceAccountName: a2a-security-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: *1
      containers:
      - name: agent-runtime
        image: REGISTRY/ai-factory-a2a-agent-runtime@sha256:REPLACE_WITH_64_HEX_DIGEST
        ports:
        - name: a2a
          containerPort: 8090
        env:
        - name: AI_FACTORY_AGENT_ROLE
          value: security-agent
        - name: AI_FACTORY_AGENT_ENDPOINT
          value: https://a2a-security-agent.ai-factory-agents.svc.cluster.local:8090/a2a
        - name: AI_FACTORY_A2A_TEMPORAL_ENABLED
          value: 'true'
        - name: AI_FACTORY_A2A_TASK_STORE_ENABLED
          value: 'true'
        - name: AI_FACTORY_A2A_TLS_ENABLED
          value: 'true'
        - name: AI_FACTORY_A2A_MTLS_REQUIRED
          value: 'true'
        - name: AI_FACTORY_A2A_CARD_ACTIVE_KID
          value: a2a-security-agent-gke-v1
        - name: AI_FACTORY_A2A_TASK_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: a2a-runtime-database
              key: password
        envFrom:
        - configMapRef:
            name: a2a-runtime-config
        readinessProbe:
          exec:
            command:
            - sh
            - "-c"
            - curl -fsSk --cert /var/run/ai-factory/a2a/tls.crt --key /var/run/ai-factory/a2a/tls.key
              https://127.0.0.1:8090/actuator/health/readiness >/dev/null
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - sh
            - "-c"
            - curl -fsSk --cert /var/run/ai-factory/a2a/tls.crt --key /var/run/ai-factory/a2a/tls.key
              https://127.0.0.1:8090/actuator/health/liveness >/dev/null
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: 750m
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: secrets
          mountPath: "/var/run/ai-factory/a2a"
          readOnly: true
        - name: tmp
          mountPath: "/tmp"
      volumes:
      - name: secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: a2a-security-agent
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
