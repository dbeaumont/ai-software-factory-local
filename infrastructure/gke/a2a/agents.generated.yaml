      ai-factory.io/agent-role: independent-reviewer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: a2a-independent-reviewer
  namespace: ai-factory-agents
  labels:
    app.kubernetes.io/name: a2a-agent-runtime
    ai-factory.io/agent-role: independent-reviewer
spec:
  minReplicas: 2
  maxReplicas: 10
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: a2a-independent-reviewer
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
