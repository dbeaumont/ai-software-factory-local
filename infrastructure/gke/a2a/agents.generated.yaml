apiVersion: v1
kind: ServiceAccount
metadata:
  name: a2a-independent-reviewer
  namespace: ai-factory-agents
  labels:
    app.kubernetes.io/name: a2a-agent-runtime
    ai-factory.io/agent-role: independent-reviewer
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: a2a-independent-reviewer
  namespace: ai-factory-agents
spec:
  provider: gcp
  parameters:
    secrets: |-
      resourceName: projects/PROJECT_ID/secrets/a2a-independent-reviewer-tls-crt/versions/latest
      fileName: tls.crt
      resourceName: projects/PROJECT_ID/secrets/a2a-independent-reviewer-tls-key/versions/latest
      fileName: tls.key
      resourceName: projects/PROJECT_ID/secrets/a2a-ca-crt/versions/latest
      fileName: ca.crt
      resourceName: projects/PROJECT_ID/secrets/a2a-ca-crl/versions/latest
      fileName: ca.crl
      resourceName: projects/PROJECT_ID/secrets/a2a-independent-reviewer-card-jwks/versions/latest
      fileName: card-jwks.json
      resourceName: projects/PROJECT_ID/secrets/a2a-independent-reviewer-mcp-token/versions/latest
      fileName: mcp-access-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-independent-reviewer
  namespace: ai-factory-agents
  labels:
    app.kubernetes.io/name: a2a-agent-runtime
    ai-factory.io/agent-role: independent-reviewer
spec:
  replicas: 2
  selector: &1
    matchLabels:
      app.kubernetes.io/name: a2a-agent-runtime
      ai-factory.io/agent-role: independent-reviewer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a2a-agent-runtime
        ai-factory.io/agent-role: independent-reviewer
    spec:
      serviceAccountName: a2a-independent-reviewer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: *1
      containers:
      - name: agent-runtime
        image: REGISTRY/ai-factory-a2a-agent-runtime@sha256:REPLACE_WITH_64_HEX_DIGEST
        ports:
        - name: a2a
          containerPort: 8090
        env:
        - name: AI_FACTORY_AGENT_ROLE
          value: independent-reviewer
        - name: AI_FACTORY_AGENT_ENDPOINT
          value: https://a2a-independent-reviewer.ai-factory-agents.svc.cluster.local:8090/a2a
        - name: AI_FACTORY_A2A_TEMPORAL_ENABLED
          value: 'true'
        - name: AI_FACTORY_A2A_TASK_STORE_ENABLED
          value: 'true'
        - name: AI_FACTORY_A2A_TLS_ENABLED
          value: 'true'
        - name: AI_FACTORY_A2A_MTLS_REQUIRED
          value: 'true'
        - name: AI_FACTORY_A2A_CARD_ACTIVE_KID
          value: a2a-independent-reviewer-gke-v1
        - name: AI_FACTORY_A2A_TASK_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: a2a-runtime-database
              key: password
        envFrom:
        - configMapRef:
            name: a2a-runtime-config
        readinessProbe:
          exec:
            command:
            - sh
            - "-c"
            - curl -fsSk --cert /var/run/ai-factory/a2a/tls.crt --key /var/run/ai-factory/a2a/tls.key
              https://127.0.0.1:8090/actuator/health/readiness >/dev/null
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - sh
            - "-c"
            - curl -fsSk --cert /var/run/ai-factory/a2a/tls.crt --key /var/run/ai-factory/a2a/tls.key
              https://127.0.0.1:8090/actuator/health/liveness >/dev/null
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: 750m
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: secrets
          mountPath: "/var/run/ai-factory/a2a"
          readOnly: true
        - name: tmp
          mountPath: "/tmp"
      volumes:
      - name: secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: a2a-independent-reviewer
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: a2a-independent-reviewer
  namespace: ai-factory-agents
  labels:
    app.kubernetes.io/name: a2a-agent-runtime
    ai-factory.io/agent-role: independent-reviewer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: a2a-agent-runtime
    ai-factory.io/agent-role: independent-reviewer
  ports:
  - name: a2a
    port: 8090
    targetPort: a2a
---
apiVersion: policy/v1
