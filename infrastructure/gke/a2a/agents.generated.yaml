---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-factory-agents
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    telemetry.ai-factory.example/enabled: 'true'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: a2a-agents-default-deny
  namespace: ai-factory-agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: a2a-agent-runtime
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: a2a-agents-required-connectivity
  namespace: ai-factory-agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: a2a-agent-runtime
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-factory-control
      podSelector:
        matchLabels:
          app.kubernetes.io/name: orchestrator
    ports:
    - protocol: TCP
      port: 8090
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-factory-control
      podSelector:
        matchLabels:
          app.kubernetes.io/name: temporal
    ports:
    - protocol: TCP
      port: 7233
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: a2a-task-db-proxy
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-factory-observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: otel-gateway
    ports:
    - protocol: TCP
      port: 4317
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: a2a-supervisor
  namespace: ai-factory-agents
  labels:
    app.kubernetes.io/name: a2a-agent-runtime
    ai-factory.io/agent-role: supervisor
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: a2a-supervisor
  namespace: ai-factory-agents
spec:
  provider: gcp
  parameters:
    secrets: |-
      resourceName: projects/PROJECT_ID/secrets/a2a-supervisor-tls-crt/versions/latest
      fileName: tls.crt
      resourceName: projects/PROJECT_ID/secrets/a2a-supervisor-tls-key/versions/latest
      fileName: tls.key
      resourceName: projects/PROJECT_ID/secrets/a2a-ca-crt/versions/latest
      fileName: ca.crt
      resourceName: projects/PROJECT_ID/secrets/a2a-ca-crl/versions/latest
      fileName: ca.crl
      resourceName: projects/PROJECT_ID/secrets/a2a-supervisor-card-jwks/versions/latest
      fileName: card-jwks.json
      resourceName: projects/PROJECT_ID/secrets/a2a-supervisor-mcp-token/versions/latest
      fileName: mcp-access-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-supervisor
  namespace: ai-factory-agents
  labels:
    app.kubernetes.io/name: a2a-agent-runtime
    ai-factory.io/agent-role: supervisor
spec:
  replicas: 2
  selector: &1
    matchLabels:
      app.kubernetes.io/name: a2a-agent-runtime
      ai-factory.io/agent-role: supervisor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a2a-agent-runtime
        ai-factory.io/agent-role: supervisor
    spec:
      serviceAccountName: a2a-supervisor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: *1
      containers:
      - name: agent-runtime
        image: REGISTRY/ai-factory-a2a-agent-runtime@sha256:REPLACE_WITH_64_HEX_DIGEST
        ports:
        - name: a2a
          containerPort: 8090
        env:
        - name: AI_FACTORY_AGENT_ROLE
          value: supervisor
        - name: AI_FACTORY_AGENT_ENDPOINT
          value: https://a2a-supervisor.ai-factory-agents.svc.cluster.local:8090/a2a
        - name: AI_FACTORY_A2A_TEMPORAL_ENABLED
          value: 'true'
        - name: AI_FACTORY_A2A_TASK_STORE_ENABLED
          value: 'true'
        - name: AI_FACTORY_A2A_TLS_ENABLED
          value: 'true'
        - name: AI_FACTORY_A2A_MTLS_REQUIRED
          value: 'true'
        - name: AI_FACTORY_A2A_CARD_ACTIVE_KID
          value: a2a-supervisor-gke-v1
        - name: AI_FACTORY_A2A_TASK_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: a2a-runtime-database
              key: password
        envFrom:
        - configMapRef:
            name: a2a-runtime-config
        readinessProbe:
          exec:
            command:
            - sh
            - "-c"
            - curl -fsSk --cert /var/run/ai-factory/a2a/tls.crt --key /var/run/ai-factory/a2a/tls.key
              https://127.0.0.1:8090/actuator/health/readiness >/dev/null
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - sh
            - "-c"
            - curl -fsSk --cert /var/run/ai-factory/a2a/tls.crt --key /var/run/ai-factory/a2a/tls.key
              https://127.0.0.1:8090/actuator/health/liveness >/dev/null
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: 750m
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: secrets
          mountPath: "/var/run/ai-factory/a2a"
          readOnly: true
        - name: tmp
          mountPath: "/tmp"
      volumes:
      - name: secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: a2a-supervisor
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: a2a-supervisor
  namespace: ai-factory-agents
  labels:
    app.kubernetes.io/name: a2a-agent-runtime
    ai-factory.io/agent-role: supervisor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: a2a-agent-runtime
    ai-factory.io/agent-role: supervisor
  ports:
  - name: a2a
    port: 8090
    targetPort: a2a
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: a2a-supervisor
  namespace: ai-factory-agents
  labels:
    app.kubernetes.io/name: a2a-agent-runtime
    ai-factory.io/agent-role: supervisor
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: a2a-agent-runtime
      ai-factory.io/agent-role: supervisor
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: a2a-supervisor
  namespace: ai-factory-agents
  labels:
    app.kubernetes.io/name: a2a-agent-runtime
    ai-factory.io/agent-role: supervisor
spec:
  minReplicas: 2
  maxReplicas: 10
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: a2a-supervisor
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
  - type: External
    external:
      metric:
        name: temporal_task_queue_backlog
        selector:
          matchLabels:
            agent_role: supervisor
      target:
        type: AverageValue
        averageValue: '5'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: a2a-supervisor-mcp
  namespace: ai-factory-agents
  labels:
    app.kubernetes.io/name: a2a-agent-runtime
    ai-factory.io/agent-role: supervisor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: a2a-agent-runtime
      ai-factory.io/agent-role: supervisor
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-factory-services
      podSelector:
        matchLabels:
          app.kubernetes.io/name: repository-context-mcp
    ports:
    - protocol: TCP
      port: 8091
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-factory-services
      podSelector:
        matchLabels:
          app.kubernetes.io/name: evidence-mcp
    ports:
    - protocol: TCP
      port: 8095
---
